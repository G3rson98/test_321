# Katalyst — Redis 7 para BullMQ en el host `internal`.
# Requisitos: RNF-CON-04 (persistencia Redis + reconciliación desde BD), ESP §4, §13.5, ARQ §4.
# Redis es transporte reconstruible: PostgreSQL es la fuente de verdad (outbox, ocurrencias, leases).

bind 0.0.0.0
protected-mode yes
port 6379
dir /data

# Persistencia AOF (fsync cada segundo) + RDB periódico como respaldo local.
appendonly yes
appendfsync everysec
appenddirname "appendonlydir"
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 100

# BullMQ exige noeviction: nunca descartar claves de la cola por memoria.
maxmemory 256mb
maxmemory-policy noeviction

# Usuarios ACL renderizados por deploy/scripts/sync-secrets.sh (contraseña solo como hash SHA-256):
#   user default off
#   user katalyst on #<sha256> ~* &* +@all -flushall -flushdb -debug -shutdown -module -config -acl
#   user healthcheck on nopass -@all +ping
aclfile /run/secrets/redis_acl

# Comandos peligrosos deshabilitados también por nombre.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

loglevel notice
logfile ""

# Katalyst — pnpm workspaces (plan §1). Una sola versión de cada dependencia compartida mediante `catalog:`.
# Versiones verificadas el 2026-11-06 (ver docs/decisiones.md D-001..D-004). Sin beta/RC.
packages:
  - packages/*
  - apps/*
  - qa-tests

catalog:
  # Lenguaje y herramientas
  typescript: 5.9.3
  '@types/node': 24.19.2
  tsx: 4.23.15
  vitest: 3.2.7
  '@vitest/coverage-v8': 3.2.7
  eslint: 10.14.0
  '@eslint/js': 10.0.1
  typescript-eslint: 8.72.1
  eslint-config-prettier: 10.1.8
  prettier: 3.9.10
  # Contratos
  zod: 4.6.7
  # Backend
  fastify: 5.12.8
  fastify-plugin: 6.0.1
  fastify-type-provider-zod: 7.0.0
  '@fastify/swagger': 9.9.3
  '@fastify/swagger-ui': 6.1.3
  '@fastify/cookie': 11.1.5
  '@fastify/cors': 11.4.1
  '@fastify/rate-limit': 11.2.2
  '@fastify/helmet': 13.2.0
  prisma: 6.19.3
  '@prisma/client': 6.19.3
  pino: 9.14.0
  pino-pretty: 13.2.0
  ioredis: 5.11.1
  bullmq: 5.81.5

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - electron
